[[tribute]]
order = 1900
title = "A Tribute to My Beloved Father, Franco Nero - The Great!"
body = """
A Tribute to My Beloved Father, Franco Nero - The Great!

A great tree has fallen, but the roots he planted run deep within us.

Saying goodbye to you, dad, is the hardest thing I have ever had to do. You were not just my father; you were my personal hype man, always hailing me and calling me "my handsome son," my first teacher, my number one disciplinarian who moulded me with cain.

Franco Nero was a man of quiet strength, immense integrity, and boundless love with the cain right beside him.

He taught me the value of hard work, honesty, and generosity. Growing up, he would always invite us to dine with him, and he loved sharing his meat even when you didn't eat with him.

Daddy had a unique way of guiding you, not through loud lectures but with discipline. He had this exceptional belief he vested in me that gave me the courage to keep going.

Daddy was a great story teller, he knows how to hold you down with gists of him from the past. You have to give it to Franco Nero for having the gift of cracking you up with laughter.

August 15th is a day I will always remember. It's been a few weeks, Dad, but I don't think I have accepted that I won't see you again. Though your physical presence is gone, your memories live on.

I will take solace in the memories we created, the laughter we shared, and the love that will never fade.

Thank you for everything... Your <i>"ALAWADA"</i> misses you greatly.

<prayer>Rest in peace, Franco Nero, the great.</prayer>

Your Fine Son,
✍🏽Peter Atsekhameh"""

[[tribute]]
order = 400
title = "Goodnight my Sweet Grandpa..."
body = """
I love you.
Your Grandson,
Oshobugie "Dior" Chinwo
"""

[[tribute]]
order = 1899
imagePath = "assets/images/family_pics/franco_nero_and_emike.jpeg"
title = "TRIBUTE TO MY POPS <br/>“FRANCO NERO INTERNATIONAL” a.k.a SKYMAN a.k.a DJANGO!!!"
subtitle = "My Daddy... My Daddy... My Popz & My “GUYEST” Guy..."
dropcap = true
body = """
His name was Francis Onoteagbor Atsekhameh, but as a young man, he decided simply being called Francis wasn't enough, so he named himself  “FRANCO NERO INTERNATIONAL” and insisted that everyone, irrespective of age, called him that. 
That was my Daddy! A character, strong-headed, confident, unconventional, and completely unapologetic about who he was.
My Popz loved sports, especially football and wrestling, and he was a diehard ARSENAL fan, so much that for someone who loved food, he would be so unhappy and refuse to eat whenever Arsenal lost a match. LOL 

My Pops was a really tough guy, but underneath all that, was a man with one of the best senses of humour who would literally crack everyone up without even trying.  
In his fit days, he loved to walk, to sing, and above all, he absolutely loved dancing, and with him, no good music was ever allowed to go to waste.
He was also an incredibly gifted writer, with an exceptional command of English, and was always the secretary in every organisation he found himself. One thing about him was the fact that he'd never let a grammatical error go unnoticed, cos he always found a way to correct you with humour and sarcasm.
He loved good conversations, good music, storytelling, and good company, but whenever Mum was around, his world was complete.

Dad was a man of many talents, he was an astute salesman — a talent and trait I proudly inherited from him. He also had a natural curiosity about languages, and he spoke English, Etsako and Yoruba fluently. 
He could gist for days, and recount events from decades ago,  like it was yesterday. He remembered dates and details in a way that amazed everyone, even in his ailing days when his memory  began to fail him in so many ways.

One of his greatest gifts to me is my love for good music, because from a very young age, he introduced me to some of the greatest musical legends — Michael Jackson,  Madonna, Millicent Small, Kenny Rogers, The Everly Brothers, and so many others. He gave me an appreciation for good music that has stayed with me throughout my life. One memory I will forever cherish was when he first wrote out on a piece of paper the lyrics of “Take a Message to Mary” for me, and together we would sing aloud.

My Daddy and I had a very unique relationship, and like every authentic relationship, it wasn't always perfect. I made sure he said “SORRY, PLEASE and THANK YOU” whenever it was required, and sometimes he would literally chase me around the house repeatedly telling me "thank you o" whenever i insisted. Despite our differences, I was somehow still the ONLY person who could make him change his mind when he would sometimes prove difficult and refuse listening to anyone else. Yes, we had our fights and sometimes disagreed, but against all odds, my Daddy remained my “GUYEST” Guy, and i was his favourite GIRL!

Whenever we saw each other or talked on the phone, man had a special way of reminding me exactly who I was to him. 
He would always start with:
“Is that my Emike?”
And then proceed to call me “EMIKE de EMIKE” repeatedly, making me laugh so hard.
He would sing my praises, pray for me, and remind me that I would always be his beautiful girl. 

He was a staunch Catholic, whose love for God ran deep, but his love for Mother Mary was enviable and truly special. He didn't stop at honouring her; he identified proudly as her son, and referred to her as "MAMMA MARY my mother".
Even in your most difficult times and lowest days, you prayed the ROSARY without ceasing, and even when you couldn't pray, you made sure to always have it on you.
And then came the day you left us.
The 15th day of August, my August!
The very day the Catholic Church celebrates the Feast of the Assumption of the Blessed Virgin Mary into Heaven -A day that commemorates the belief that when Mary ended her earthly life, God took her body and soul up into heaven.
To some, this may simply be a coincidence.
But to me — and to everyone who truly knew you and witnessed your extraordinary devotion to her — it feels like something much deeper, and we believe your mother came to take you home.
Perhaps, after all those years of calling her Mother, she answered when it was finally time for you to go home.

Daddy, I am deeply honoured that you found me worthy of entrusting your final wishes, and I am even more honoured that your children are fulfilling them. Aunty Ivy is doing an excellent job too. She's truly making you proud.
 We know you're smiling down on us because your beloved wife and children did not let you down.

My only request to you now is that you Take the BEST care of Mummy, as she did you during your time here on earth.🙏🏽 Continue to be her guardian angel, watch over her, comfort her, protect her and guide her until the day you both meet again, never to part anymore.

I know Mummy misses you terribly.
We all do... because there is now a silence where your voice used to be.
A space where your stories and laughter used to fill.
Thank you my GUY.
Thank you for the lessons, the laughter, the music, the stories, the dance moves, the prayers and even the disagreements.
Thank you for introducing me to the beautiful things that shaped the lady I am today.
Thank you for the parts of yourself that lives on in me.
Your work here is done Popz. 
No more worries about Arsenal.
No more grammatical errors to correct.
No more dinners to boycott after an Arsenal defeat.
No more health battles.
No more pain.
Just pure peace.
Until we meet again... keep resting in the bosom of the Lord, my SKY MAN, and enjoy the loving arms of your Mother Mary.
Adieu, Pops.

Yours Truly,
"Emike De Emike"
"Your Omosi No Ni 20 I'zao"
"""

