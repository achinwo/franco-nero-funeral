[[tribute]]
order = 200
dropcap = true
title = "TRIBUTE TO OUR DEPARTED MEMBER"
from = "by THE ASSOCIATION OF AUCHI CATHOLIC DIOCESE INDIGENES"
body = """
It is with deep sorrow and a profound sense of loss that the Association of Auchi Catholic Diocese Indigenes pays this tribute to our dear brother, Sir. Francis Atsekhameh, whose death has left a painful void in our Association, the Church and among all who had the privilege of knowing him.
The news of his passing came to us with great sadness. Nevertheless, as Christians, we are consoled by the assurance that for those who believe in Christ, death is not the end, but a passage to eternal life.
As a member of our Association, Sir Francis Atsekhameh was a valued brother whose presence, fellowship and contributions will remain fondly remembered. He identified with the objectives and aspirations of the Association and demonstrated the spirit of brotherhood, unity and mutual support which we hold dear.
To his immediate family, relatives, friends and loved ones, we extend our heartfelt condolences. We pray that God will grant you the strength and fortitude to bear this irreparable loss. May the memories of his good deeds and the positive impact he made during his lifetime remain a source of comfort to you.
As an Association, we shall continue to cherish his memory and remember him in our prayers and Holy Masses.
May your soul, and the souls of all the faithful departed, through the mercy of God, rest in peace. Amen.

<signoff>
Signed: Lady G.E.T. Umolu
Vice Chairman 
For: Chairman
</signoff>
"""

[[tribute]]
order = 10000
title = "TRIBUTE TO MY FATHER SIR FRANCIS ATSEKHAMEH <br/>(FRANCO NERO INTL)"
body = """
You never truly realize the value of a moment until it becomes a memory. 
A rush of memories came flooding the moment I received the news of your demise, so intense that it kept me awake for almost 72hrs. The pain was deep, the reality was heartbreaking. I'd never see my Franco Nero alive again. 
My earliest memories of life was all about you. The playfulness, the laughter, the songs. I even remember the first time I went to school in nursery one, Franco Nero had me on his shoulders. My first bicycle lessons, my first bike ride, I still remember the first of many times you took me to Ogbe stadium to watch your beloved Bendel Insurance FC. 

That fueled my passion for football that has stuck till date, we were always going to the home games.
Daddy will always carry me on his shoulders into the stadium, protecting me from the crowd surge. That thought me a valuable lesson in love at that early age. You do everything in life to protect the ones you truly love and cherish. 
My love for reading came from you at that young age. Daddy made me read the newspapers at age six. I went through his entire collection of novels before I finished primary school. Talking about dozens and dozens of books that were way beyond my tender age at the time. He always encouraged and motivated me to be a voracious reader. A trait I still carry till this day.
Daddy also shaped my love for music too, his collection of vinyl records was a collectors delight any day. That turn table brought so much joy to the family on a daily basis. 
Your strict discipline taught me to make the right choices in life and stay on the straight and narrow path. I knew pretty early in life not to take anything that wasn't mine, even by mistake. You taught me early about accountability and that all actions had consequences, whether good or bad. 
Franco Nero was firm in a loving kind of way. You just knew not to go doing wrong things out there because he would protect you publicly but reprimand you in private. Those lessons shaped my personality to this day, gave me the knowledge of good or evil and the choice to make every single time. 
As you got older and softer, I really got to appreciate you better for all the lessons I didn't realize at the time that had gone ahead to shape my lifestyle and choices. 
Thank you for teaching me that integrity always wins over short cuts. I became a better man because I was raised by you daddy. Valuable lessons that we take for granted in life. I remember all our conversations on my last visit and I promise to step into the big vacuum you left and be there for mom, my younger siblings and all your grandchildren going forward. I accept the responsibility and hope to excel in my new role with God's help.
Farewell Sir Francis Onoteagbor Atsekhameh, our very own Franco Nero. You always called yourself the Sky man, we know you'll always protect and watch over us from the Skies in the company of the Angels and Saints. 
Thank you for life and everything daddy, probably didn't say it as much as I should have done every day. Till we meet again on resurrection morning, journey well Sir. 

<signoff>
SOLOMON OSIGBEMEH ATSEKHAMEH 001.
</signoff>
"""
