title = "Funeral Tributes"

[[tribute]]
order = 550
imagePath = "assets/images/family_pics/Screenshot_20220101-124628_WhatsApp.jpeg"
title = "OUR TRIBUTE TO GRANDPA"
body = """
Dear Grandpa,
It is difficult to say goodbye to you. We wish we could have more time with you, but we are thankful to God that you were our grandpa and that you will always be part of our family story.
We will remember you with love. Even though we cannot see you anymore, you will remain in our hearts, in our prayers and in the memories our family shares about you.
Grandpa, we promise that we will do our best to grow into children you would be proud of. We will love and support one another, respect our family, work hard, remain humble and keep God at the centre of our lives. We will carry the Atsekhameh name with honour and allow the good things you stood for to continue through us.
As you go to rest, we pray that God welcomes you into heaven and gives you eternal peace. This is not goodbye forever, because our faith teaches us that we shall meet again.
Rest well, Grandpa. We love you, we will miss you, and we will never forget you.

Our promise  We will honour Grandpa by loving God, loving our family, working hard and living in a way that would make him proud.

May his soul, and the souls of all the faithful departed,
through the mercy of God, rest in peace. Amen.

With all our love,
Talia & Tyshawn"""

[[tribute]]
order = 1001
title = "TRIBUTE TO MY FATHER-IN-LAW, FRANCIS ATSEKHAMEH"
body = """
It is with a heart filled with sadness, gratitude and faith that I pay tribute to my dear father-in-law, Francis Atsekhameh. His passing has left a space in our family that words cannot fully describe, yet we are comforted by the life he lived and by the hope we have in Christ.
He was a devoted Catholic whose faith was not merely a title, but an important part of who he was. His devotion reminds us that our earthly journey is temporary and that the promise of eternal life belongs to those who place their trust in God.
As a husband, father, father-in-law and grandfather, he occupied a cherished place in our family. We thank God for the years we were privileged to share with him and for the family legacy that continues through his children and grandchildren. Though we grieve because we can no longer see him, we remain grateful that he was part of our lives.
The words of Scripture give us comfort: <prayer>“I am the resurrection and the life. Whoever believes in me, though he die, yet shall he live.” (John 11:25).</prayer> We therefore entrust him into the loving and merciful hands of God, believing that death is not the end but a passage into eternal rest.
Dear Daddy, may the Lord forgive every human failing, reward your faith and receive your soul into His heavenly kingdom. May Our Lady, whom you honoured as a Catholic, intercede for you, and may the angels lead you into paradise.
You will be remembered with love, spoken of with gratitude and carried always in our hearts. Rest peacefully, Francis Atsekhameh. Until we meet again in the presence of God.
Eternal rest grant unto him, O Lord,
and let perpetual light shine upon him.
May his soul rest in perfect peace. Amen.
<br/>
Your daughter in-law,
Katie Emesomiade Atsekhameh"""

[[tribute]]
order = 2000
imagePath = "assets/images/family_pics/franco_nero_and_emma.jpeg"
title = "A Befitting Tribute to My Beloved Dad"
body = """
Today, I celebrate the life of an exceptional man, a loving father, a devoted Christian, and a man whose presence brought warmth and joy to everyone around him.
My Dad was a disciplined devoted husband/father and a man of faith. He loved God deeply and held a special devotion to Mother Mary. His faith was not merely something he professed; it was reflected in the way he lived, treated people, and carried himself. He trusted in God and sought to live a life worthy of His love and mercy.
Professionally, Dad was an astute and gifted salesman. He had a remarkable ability to connect with people, understand them, and earn their trust. His interpersonal skills, confidence, determination, and natural charm made him exceptional at what he did. But beyond the profession was a man who valued people and relationships. To those who knew him, he was much more than a salesman—he was a friend, a confidant, and a man whose word could be trusted.
Dad was also a jovial and cheerful man. He had a wonderful sense of humour and could light up a room with his presence. His laughter, jokes, conversations, and infectious personality created memories that will remain with us forever. Even in difficult moments, he had a way of bringing smiles to people's faces.
And then there was his love for sports. Dad enjoyed football and wrestling, and these were more than mere pastimes for him. They were opportunities for excitement, conversation, and shared moments with family and friends. His passion for football was particularly memorable because he was a staunch supporter of our beloved Arsenal Football Club. Supporting Arsenal was something he embraced wholeheartedly—with all the emotions, debates, celebrations, disappointments, and unwavering loyalty that come with being a true football fan.
Dad, you lived a life filled with faith, hard work, laughter, friendship, family, and passion. You touched many lives in ways you may never have fully realised. Your departure has left a space that cannot be filled, but the memories you created and the values you passed on will continue to live through us.
We will remember your smile.
We will remember your humour.
We will remember your love for God and Mother Mary.
We will remember the salesman who could win people over with his words and personality.
We will remember the sports lover who could get caught up in the excitement of a football match or wrestling bout.
And, of course, we will remember the proud Arsenal supporter who remained loyal through the highs and lows.
Dad, your earthly journey has ended, but your story continues in the hearts of all who loved you.
As we mourn your passing, we also give thanks to God for the gift of your life and for the privilege of having you as our father.
May God Almighty, whom you loved and served, receive your soul. May the Blessed Virgin Mary, to whom you were devoted, intercede for you and lead you gently into eternal rest.
Rest peacefully, Dad.
You will always be loved.
You will always be remembered.
You will forever remain a part of us.
<prayer>
Eternal rest grant unto him, O Lord,
and let perpetual light shine upon him.
May his soul, and the souls of all the faithful departed,
through the mercy of God, rest in peace.
Amen.</prayer>
Until we meet again, Dad—rest well.
And from wherever you are, keep an eye on us all and watch Arsenal defend the league I am glad you saw us win after more than two decades before passing. Journey well Franco Nero.

Your fellow Arsenal lover,
Emma \"Boogie\" Atsekhameh"""

