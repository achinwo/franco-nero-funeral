# Which photograph each full-page plate is built from.
#
# These are the three plates that take a whole A5 sheet, edge to edge: the
# cover, and the two frontispieces that open a section on a picture. Change a
# path here and re-run `sh assets/make-plates.sh` -- nothing in sections/
# needs touching, because the sections ask for the plate by name and this file
# settles what goes into it.
#
# Paths are relative to assets/images/, the same root the booklet gives
# \includegraphics and the same one assets/data/captions.toml uses.

# --- the cover -------------------------------------------------------------
# `source` is used exactly as given: copied to plates/cover-sky, unchanged.
# No crop, no tone, no scrim, no montage. That is the point of it -- a cover
# finished in another program comes back in as itself, and what you see there
# is what prints.
#
# Two things follow from "unchanged" that are worth knowing before you spend
# an afternoon on one:
#
#   Shape.  The page draws this at the full width and the full height of the
#           sheet, so an image that is not A5 in proportion is stretched to
#           fit rather than cropped. A5 is 148x210mm, which is 1748x2480 at
#           300dpi -- make the artwork that size and nothing moves.
#
#   Bleed.  It runs to the trim on all four sides. Keep anything that must
#           survive the guillotine a few millimetres inside the edge.
#
# Leave `source` empty (or delete the line) and the cover is built the way it
# always was: the cloudscape in sky_backdrop.png with the cut-out stood up in
# it, composited by assets/make-plates.sh. Everything that montage needs is
# still in that script, so this is a switch rather than a demolition -- you
# can go back to it by emptying one line.
[cover]
source = "franco_nero_cover.png"

# --- the frontispieces -----------------------------------------------------
# A portrait cover-cropped to the page with a white field burnt into the foot
# for the type to sit on, and a gradient dissolving the field back into the
# photograph so there is no visible edge. Unlike the cover, these two *are*
# processed -- that scrim is what makes the type at the foot readable.
#
# `field` is where the white field begins, as a percentage down the page. It
# is a property of the crop rather than a house style: the lower the figure,
# the more of the photograph is burnt away, so a tightly cropped portrait
# wants a larger number than a loose one. Move it if a new picture comes out
# with its subject half dissolved, or with the caption sitting on a shirt.

# Opens the Photographs section.
[front-studio]
source = "plates/plate-studio.png"
field = 74

# Opens A Life Remembered. A different photograph from the one above,
# deliberately: two sections opening on the same portrait reads as a shortage
# of pictures rather than as a motif. Its field starts lower because the
# agbada crop is tighter, and burning white from 74% would have taken the
# robe with it.
[front-life]
source = "plates/plate-agbada.png"
field = 79

# --- the closing page of A Life Remembered --------------------------------
# The photograph behind the family's last words. Unlike the frontispieces this
# one has a whole page of text over it, so it is veiled rather than scrimmed:
# white is laid over the picture, lightly at the top and at full strength
# below, so that he salutes out of a clear sky and the words underneath sit on
# pale ground.
#
#   veil    how much white at full strength, as a percentage. Higher is
#           paler ground and easier reading; lower keeps more of the picture.
#   clear   how far down the page, as a percentage, the veil reaches that
#           strength. Everything above it is a ramp from a quarter veil, so
#           this is in effect where the photograph stops being a photograph
#           and starts being a background. Set it to just below his shoulders.
#
# 82 was arrived at by reading the page rather than by taste: at 70 the first
# three lines cross the dark of his jacket and the yellow of the sash, and the
# italic is legible but not comfortable -- which is the wrong side of the line
# for a page an elderly mourner reads once, in a church, in whatever light the
# church has.
#
# Unlike the cover this one has no fallback: emptying `source` builds no plate
# at all, and sections/03-biography.tex would then ask for a picture that is
# not there. To take the photograph off that page, remove the
# \pageghost{close-life} line from the section as well.
[close-life]
source = "franco_nero_salute_with_light.png"
veil = 82
clear = 32

# --- the back cover --------------------------------------------------------
# The portrait behind the family's words of thanks. Neither a ghost nor a
# frontispiece: the ghosts clear the *top* of the page so a section heading
# can sit above the figure, which on a page of solid text meant fading his
# head away to nothing, and a frontispiece burns a white field at the foot,
# which is exactly where this one wants him. So he is placed instead --
# scaled, centred on his face and stood at the foot of the sheet, fading up
# into clean paper before the last line of type reaches him.
#
#   head      where the top of his head sits, as a percentage down the page.
#             He stands at the head of the sheet now and is the first thing on
#             it, so this is a small number and the photograph bleeds off the
#             top, the sides, or both.
#   headsize  the height of his head, as a percentage of the page. This is
#             the one number to reach for if he reads too big or too small --
#             it scales the whole figure about his face. Past about 12.8 the
#             figure is wider than the sheet and bleeds off both sides, which
#             is how he is printed this large and is meant rather than
#             tolerated.
#   holdto    how far down the page he prints at full strength.
#   fade      the length of the ramp below that, as a percentage of the page.
#             Below holdto+fade there is nothing but paper, and that is what
#             the divider and the panel at the foot of the page stand on --
#             which is why these two are set outright rather than measured off
#             his head, as they were when he sat at the foot of the sheet.
#   ink       the darkest tone in the wash. Higher contrast than the ghosts
#             carry, because nothing is printed over him: this is the one
#             place in the booklet where the picture is meant to be looked at
#             rather than sensed. Paler here is safer on a light press.
#
# The next three say where his head is in the source photograph, as
# percentages of that image: how the placement knows what to centre on and
# how much to scale it by. They are properties of the picture, not of the
# page, so they only need touching when `source` does.
#
#   facex     the centre of his face, across the source
#   facetop   the top of his head, down the source
#   facefoot  his chin, down the source
#
# The last six are the shim the appreciation is read off -- a panel of cream
# laid over him behind the words, where they cross his chest. They are the one
# place in this file that knows anything about the type on the page: the block
# is set by sections/09-backcover.tex, and these put cream under exactly it,
# so the two move together or not at all.
#
#   shimleft   its edges, across the page. Both run to the bleed: his jacket
#   shimright  fills the sheet at this size, and a shim that stops short of
#              the trim leaves a vertical seam down the darkest part of it.
#   shimtop    its edges, down the page. shimtop is the number to reach for
#   shimfoot   when he wants to be more visible: every millimetre it is set
#              lower is a millimetre more of his chest printed at full
#              strength, and it only has to be far enough above the first line
#              of the appreciation for the blur below to have got there. Past
#              shimfoot there is nothing left of him to read anything off.
#   shimveil   how much cream is laid over him there, 0-100. Not 100: he is
#              meant to be seen through it.
#   shimsoft   the blur sigma, as a percentage of the page width. Generous --
#              a shim with an edge anywhere reads as a box on the page.

[back-portrait]
source = "plates/plate-studio.png"
head = 6
headsize = 17
holdto = 38
fade = 26
ink = "#A08767"
facex = 41
facetop = 3.7
facefoot = 25.1
shimleft = 0
shimright = 100
shimtop = 30
shimfoot = 70
shimveil = 80
shimsoft = 2.4
